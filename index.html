<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pawtopia｜汪汪職涯小鎮</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="data/strengths.js"></script>
  <script defer src="data/routes.js"></script>
  <script defer src="js/music.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <svg width="0" height="0" class="sprite-filters" aria-hidden="true" focusable="false">
    <defs>
      <filter id="sprite-matte" color-interpolation-filters="sRGB">
        <feComponentTransfer>
          <feFuncA type="linear" slope="5" intercept="-3.57"/>
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>
  <button id="music-toggle" class="music-toggle" type="button" aria-pressed="true">音樂：開</button>
  <main class="shell">
    <section id="scene" aria-labelledby="scene-title"></section>
    <noscript>請開啟 JavaScript 以開始冒險。</noscript>
  </main>
</body>
</html>
